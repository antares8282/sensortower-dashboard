name: Monthly Niche Scan

# Feeds the Opportunities page. Monthly rather than weekly because what it
# measures — how crowded, how well-monetized and how ad-gated a niche is —
# moves on a scale of months.
#
# Cost per run: ~462 catalog sweep + ~350 enrich + ~135 ad-intel ≈ 950 calls.
# (niche_reclassify.py is a local dev tool for when classification rules
# change; CI runs filter and enrich fresh, so it is not needed here.)
on:
  schedule:
    - cron: '0 4 1 * *'  # 1st of the month, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  niche-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Catalog sweep
        env:
          SENSORTOWER_API_TOKEN: ${{ secrets.SENSORTOWER_API_TOKEN }}
        run: python scripts/niche_scan.py --budget 600

      - name: Confirm niche membership
        run: python scripts/niche_filter.py

      - name: Enrich with ratings and estimates
        env:
          SENSORTOWER_API_TOKEN: ${{ secrets.SENSORTOWER_API_TOKEN }}
        run: python scripts/niche_enrich.py --budget 600

      - name: Sample paid-UA pressure
        env:
          SENSORTOWER_API_TOKEN: ${{ secrets.SENSORTOWER_API_TOKEN }}
        run: python scripts/niche_ads.py --top 5 --budget 250

      - name: Score opportunities
        run: python scripts/niche_opportunity.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard_data/current/niches.json data/niche/ \
                  data/api_usage_log.json reports/
          git diff --staged --quiet || git commit -m "Monthly niche scan $(date +%Y-%m-%d)"
          git push origin HEAD:main
