name: Monthly Niche Scan

# Feeds the Opportunities page. Runs monthly rather than weekly because the
# thing it measures — how crowded and how well-monetized a niche is — moves on
# a scale of months, not days. ~291 calls per run.
#
# Order matters: scan (catalog sweep) -> filter (no API) -> enrich (estimates)
# -> opportunity (no API, writes dashboard_data/current/niches.json).
on:
  schedule:
    - cron: '0 4 1 * *'  # 1st of the month, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  niche-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Catalog sweep
        env:
          SENSORTOWER_API_TOKEN: ${{ secrets.SENSORTOWER_API_TOKEN }}
        run: python scripts/niche_scan.py --budget 400

      - name: Confirm niche membership
        run: python scripts/niche_filter.py

      - name: Enrich with ratings and estimates
        env:
          SENSORTOWER_API_TOKEN: ${{ secrets.SENSORTOWER_API_TOKEN }}
        run: python scripts/niche_enrich.py --budget 250

      - name: Score opportunities
        run: python scripts/niche_opportunity.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard_data/current/niches.json data/niche/ \
                  data/api_usage_log.json reports/
          git diff --staged --quiet || git commit -m "Monthly niche scan $(date +%Y-%m-%d)"
          git push origin HEAD:main
