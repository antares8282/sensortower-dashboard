name: Biweekly Chart Refresh

# Was daily (~145 calls/day = ~4,350/month against a 2,500 budget), then
# weekly (~631/month). Now every 2 weeks at ~290/month, combined with the
# monthly niche scan (~950/month) for a total of ~1,240/month.
#
# Cron has no native "every N weeks" interval, so this runs on the 1st and
# 15th of each month instead -- the standard idiom for "biweekly" in cron,
# and close enough to true 14-day spacing (13-16 days depending on month
# length) without needing a script-side week-parity check.
on:
  schedule:
    - cron: '0 6 1,15 * *'  # 1st and 15th of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run data refresh
        env:
          SENSORTOWER_API_TOKEN: ${{ secrets.SENSORTOWER_API_TOKEN }}
        run: python scripts/data_refresh.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard_data/ data/api_usage_log.json data/processed/
          git diff --staged --quiet || git commit -m "Chart refresh $(date +%Y-%m-%d)"
          git push origin HEAD:main
